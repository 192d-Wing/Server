# SPDX-License-Identifier: Apache-2.0
# >>> FUZZ-DELTA replaces=23: header for the fuzz workspace policy
#
# cargo-deny policy for the EXCLUDED fuzz workspace rust/fuzz/ (cargo-fuzz,
# libFuzzer). It is rust/deny.toml plus exactly the marked FUZZ-DELTA
# blocks: the development-only native-code exception for libfuzzer-sys,
# which compiles LLVM libFuzzer (C++) with `cc` (Phase 1 plan Q2, approved
# 2026-10-27).
# POAM: POAM-2026-10-27-01 - development-only libFuzzer native-code exception. scripts/check-fuzz-policy.sh (in `make policy`) fails if any
# line outside a FUZZ-DELTA block differs from rust/deny.toml, if a block
# holds anything other than the approved exception, or if a block is missing.
# To change shared policy, edit rust/deny.toml and copy the change here.
#
# Run from rust/: `make fuzz-deny` (cargo deny --manifest-path
# fuzz/Cargo.toml check --config fuzz/deny.toml, then cargo audit on
# fuzz/Cargo.lock and check-native-deps.sh with fuzz/native-allowlist.txt).
#
# COMPLIANCE MAPPING:
# - NIST 800-53: RA-5 (Vulnerability Monitoring and Scanning), SI-2 (Flaw
#   Remediation), CM-7 (Least Functionality), CM-10 (Software Usage
#   Restrictions), SR-3 (Supply Chain Controls and Processes), SR-4
#   (Provenance), SA-11(8) (Dynamic Code Analysis), SA-15 (Development
#   Process, Standards, and Tools)
#
# Advisory ignores stay identical to rust/deny.toml and rust/.cargo/audit.toml
# (`make fuzz-deny` runs cargo audit from rust/, so that audit.toml applies).
# <<< FUZZ-DELTA

[graph]
# Empty = evaluate every target triple (strictest).
targets = []
# Match `make clippy` / `make test` (`--all-features`) so feature-gated
# dependencies of workspace members are policy-checked too.
all-features = true
no-default-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories (RA-5, RA-5(2), SI-2, SA-22).
# ---------------------------------------------------------------------------
[advisories]
version = 2
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Report unmaintained crates anywhere in the graph (matches cargo-audit, whose
# warnings `--deny warnings` turns into failures).
unmaintained = "all"
yanked = "deny"
# Mirror of .cargo/audit.toml; see that file for the full triage notes.
# POAM: POAM-2026-10-26-09 - both ignores are an open exception, accepted by
# the user on 2026-10-27 for development, pending AO review (status Open, not
# "Risk Accepted"). Remove both entries here and in .cargo/audit.toml when
# upstream drops the crates or if the AO does not accept the risk.
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained; build-time proc-macro dep of yew-macro 0.23 (no runtime code, no fix upstream). SA-22 exception (POAM-2026-10-26-09, open; accepted for development 2026-10-27, pending AO review)." },
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.x unmaintained; non-optional via yew 0.23 -> gloo 0.11 -> gloo-worker 0.5; TAK-RS uses no gloo-worker API. SA-22 exception (POAM-2026-10-26-09, open; accepted for development 2026-10-27, pending AO review)." },
]
maximum-db-staleness = "P30D"
git-fetch-with-cli = false

# ---------------------------------------------------------------------------
# Licenses (CM-10, SR-3). cargo-deny >= 0.18 denies any licence that is not in
# `allow` or a per-crate exception, and has no separate `copyleft` key.
#
# Copyleft and weak-copyleft licences (GPL-*, LGPL-*, AGPL-*, MPL-2.0, EPL-*,
# CDDL-*, EUPL-*, OSL-*, CC-BY-SA-*) are therefore DENIED BY ABSENCE. This also
# keeps any dependency on the GPLv3 TAK Server code in src/ out of the graph.
# Adding one needs a plan entry and legal sign-off (CM-10).
#
# Workspace crates are Apache-2.0 (`license.workspace = true`) and pass through
# this allow-list; there are deliberately no per-crate exceptions for them.
# ---------------------------------------------------------------------------
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "0BSD",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.8
exceptions = [
    # The FIPS 140-3 AWS-LC module (D5, SC-13), from Phase 2. Expression
    # "ISC AND (Apache-2.0 OR ISC) AND OpenSSL" (aws-lc-fips-sys-0.14.3
    # Cargo.toml). The OpenSSL licence is permissive (BSD-style with an
    # advertising/attribution clause) and compatible with Apache-2.0.
    # Accepted for this crate only; attribution is in rust/NOTICE.
    { allow = ["OpenSSL"], crate = "aws-lc-fips-sys" },
    # aws-lc-sys (POAM-2026-10-26-08) needs NO exception: its expression
    # (aws-lc-sys-0.46.0) is "ISC AND (Apache-2.0 OR ISC) AND Apache-2.0 AND MIT
    # AND BSD-3-Clause AND (Apache-2.0 OR ISC OR MIT) AND
    # (Apache-2.0 OR ISC OR MIT-0)", satisfiable from `allow`.
    # Add webpki-roots / CDLA-Permissive-2.0 etc. only when such a crate appears.
    # >>> FUZZ-DELTA replaces=0: libFuzzer licence (plan Q2)
    # libfuzzer-sys-0.4.13 Cargo.toml: "(MIT OR Apache-2.0) AND NCSA". NCSA
    # (University of Illinois/NCSA Open Source License) covers the bundled
    # LLVM libFuzzer sources; permissive, BSD-style, Apache-2.0 compatible.
    # Development-only: fuzz binaries are never distributed.
    # POAM: POAM-2026-10-27-01 - development-only libFuzzer native-code exception.
    { allow = ["NCSA"], crate = "libfuzzer-sys" },
    # <<< FUZZ-DELTA
]

[licenses.private]
# Unpublished workspace crates are still licence-checked.
ignore = false
registries = []

# ---------------------------------------------------------------------------
# Bans (SR-3). Layer one of the pure-Rust policy: native code is allowed ONLY
# for the AWS-LC family behind aws-lc-rs, plus the build-time toolchain crates
# those -sys crates need. `wrappers` = the only crates allowed to depend on the
# denied crate directly; every chain below was verified against the cached
# manifests (aws-lc-rs-1.18.2, aws-lc-fips-sys-0.14.3, aws-lc-sys-0.46.0,
# cmake-0.1.58, bindgen-0.73.2, clang-sys-1.9.1). dunce, fs_extra, regex,
# jobserver, shlex and find-msvc-tools are pure Rust and need no rule.
# If a wrapper chain cannot be expressed, extend `wrappers` with a rationale;
# never remove a ban.
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies (all `publish = false`) carry no version.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
skip = []
skip-tree = []
deny = [
    # --- Native-code exceptions (D5) --------------------------------------
    # The FIPS 140-3 module: the ONLY permitted cryptographic native code and
    # the FIPS boundary. No first-party crate may call the C bindings directly.
    { crate = "aws-lc-fips-sys", wrappers = ["aws-lc-rs"], reason = "D5: FIPS module reachable only through aws-lc-rs" },
    # Non-FIPS AWS-LC, pulled in by rustls 0.23 `fips` (its aws_lc_rs feature
    # enables aws-lc-rs/aws-lc-sys). Linked but unused, outside the FIPS
    # boundary. Approved by the user 2026-10-26.
    # POAM: POAM-2026-10-26-08 - linked-but-unused non-FIPS AWS-LC.
    { crate = "aws-lc-sys", wrappers = ["aws-lc-rs"], reason = "POAM-2026-10-26-08: non-FIPS AWS-LC only via aws-lc-rs" },

    # --- Build-time toolchain crates, only under the AWS-LC -sys crates ----
    { crate = "cmake", wrappers = ["aws-lc-fips-sys", "aws-lc-sys"], reason = "C build only for AWS-LC" },
    # cmake-0.1.58 depends on cc.
    # >>> FUZZ-DELTA replaces=1: libfuzzer-sys may wrap cc (plan Q2)
    # libfuzzer-sys-0.4.13 build-dep: cc 1.x (`parallel`), compiling libFuzzer
    # C++ on the build host for fuzz binaries only.
    # POAM: POAM-2026-10-27-01 - development-only libFuzzer native-code exception.
    { crate = "cc", wrappers = ["aws-lc-fips-sys", "aws-lc-sys", "cmake", "libfuzzer-sys"], reason = "C compilation only for AWS-LC; C++ libFuzzer only for the dev-only fuzz workspace (plan Q2)" },
    # <<< FUZZ-DELTA
    # Non-optional build-dep of aws-lc-fips-sys; optional (`bindgen` feature)
    # in aws-lc-sys.
    { crate = "bindgen", wrappers = ["aws-lc-fips-sys", "aws-lc-sys"], reason = "binding generation only for AWS-LC" },
    # bindgen-0.73.2 -> clang-sys (`runtime`): dlopens libclang at build time,
    # only when bindings are regenerated; never linked into shipped binaries.
    { crate = "clang-sys", wrappers = ["bindgen"], reason = "build-time libclang only via bindgen" },
    # cfg(unix) build-dep of both AWS-LC -sys crates.
    { crate = "pkg-config", wrappers = ["aws-lc-fips-sys", "aws-lc-sys"], reason = "build-time probe only for AWS-LC" },

    # --- Alternative crypto/TLS stacks (D5: aws-lc-rs FIPS is the only provider)
    { crate = "openssl", reason = "D5: aws-lc-rs FIPS is the only crypto provider" },
    { crate = "openssl-sys", reason = "D5: aws-lc-rs FIPS is the only crypto provider" },
    { crate = "native-tls", reason = "D5: rustls on aws-lc-rs FIPS is the only TLS stack" },
    { crate = "ring", reason = "D5: aws-lc-rs FIPS is the only crypto provider" },
    { crate = "boring", reason = "D5: aws-lc-rs FIPS is the only crypto provider" },
    { crate = "boring-sys", reason = "D5: aws-lc-rs FIPS is the only crypto provider" },
    { crate = "libsodium-sys", reason = "D5: aws-lc-rs FIPS is the only crypto provider" },
    { crate = "vcpkg", reason = "pure-Rust policy: no system native-library discovery" },
    # RustCrypto primitive crates are NOT banned in Phase 0; the Phase 2
    # tak-crypto/tak-auth plan decides (bcrypt for UserAuthenticationFile needs
    # Blowfish, which no FIPS module provides). A future
    # { crate = "aws-lc-rs", wrappers = [...] } rule is deferred to that plan.

    # --- C wrappers with pure-Rust alternatives -----------------------------
    { crate = "libz-sys", reason = "pure-Rust policy: use zlib-rs or miniz_oxide" },
    { crate = "libsqlite3-sys", reason = "pure-Rust policy: no native SQLite" },
    { crate = "zstd-sys", reason = "pure-Rust policy: no native zstd" },
    { crate = "bzip2-sys", reason = "pure-Rust policy: no native bzip2" },
    { crate = "lzma-sys", reason = "pure-Rust policy: no native lzma" },
]

# Layer three (SR-3, SR-11): no pre-built executables in any crate's source,
# including dependencies. Interpreted scripts are not flagged (default).
# Verified quiet on the Phase 0 graph with cargo-deny 0.20.2. Known Phase 2
# work: the FIPS graph (clang-sys -> libloading 0.8.9) ships two Windows test
# DLLs (tests/nagisa32.dll, tests/nagisa64.dll); add a checksum-pinned
# `bypass` for them when aws-lc-rs lands, never a blanket allow.
[bans.build]
executables = "deny"
include-dependencies = true
include-workspace = true
include-archives = true
bypass = []
# Layer three (b): only these crates may have a build script (build.rs runs
# on the build host and can emit `cargo:rustc-link-lib` without a `links`
# key, so check-native-deps.sh would not see it; SEC-007). Today's graph,
# all targets, --all-features (cargo metadata; Phase 0 2026-10-26, Phase 1a
# 2026-10-27: anyhow, getrandom, num-traits, rustix, tak-proto added, each
# build.rs read; none has a `links` key, a `cc` build-dep or a link
# directive). Adding a crate here needs a rationale in the PR (what the build
# script does). The AWS-LC -sys/toolchain crates are added with Phase 2
# tak-crypto.
allow-build-scripts = [
    "anyhow",                # rustc probe (compiles a Rust test file) and cfg only; via prost-derive/prost-build (build/proc-macro)
    "getrandom",             # cfg probe only; proptest -> rand 0.10, dev-only
    "libc",                  # rustc version/cfg probes only
    # >>> FUZZ-DELTA replaces=0: libfuzzer-sys build script (plan Q2)
    # POAM: POAM-2026-10-27-01 - development-only libFuzzer native-code exception.
    "libfuzzer-sys",         # build.rs compiles libFuzzer C++ with cc (feature link_libfuzzer); dev-only fuzz workspace, never shipped
    # <<< FUZZ-DELTA
    "num-traits",            # autocfg rustc probes, cfg only; proptest, dev-only
    "prettyplease",          # check-cfg and VERSION only (links marker)
    "proc-macro-error",      # rustc version probe (POAM-2026-10-26-09)
    "proc-macro-error-attr", # rustc version probe (POAM-2026-10-26-09)
    "proc-macro2",           # rustc feature probe
    "quote",                 # rustc version probe
    "rustix",                # rustc probes (asm/feature) and cfg only; prost-build -> tempfile, build-host only
    "rustversion",           # rustc version probe
    "serde",                 # rustc version probe
    "serde_core",            # rustc version probe
    "serde_json",            # cfg probes only
    "syn",                   # rustc version probe
    "tak-proto",             # first-party: compiles the in-place .proto schemas with protox + prost-build (pure Rust, no protoc); POAM-2026-10-26-05
    "thiserror",             # rustc feature probe (both versions)
    "wasm-bindgen",          # cfg probes and one wasm `rustc-link-arg` export; no native library
    "wasm-bindgen-shared",   # schema version (links marker)
    "zmij",                  # cfg probes only
]

# ---------------------------------------------------------------------------
# Sources (SR-4, SR-11): crates.io only; no git dependencies.
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
