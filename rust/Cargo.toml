# SPDX-License-Identifier: Apache-2.0
#
# TAK-RS Cargo workspace root.
#
# COMPLIANCE MAPPING:
# - NIST 800-53: CM-2 (Baseline Configuration), CM-6 (Configuration Settings),
#   CM-10 (Software Usage Restrictions), SA-15 (Development Process, Standards,
#   and Tools)
#
# Every member inherits package metadata (`*.workspace = true`, including
# `license.workspace = true`) and the lint baseline (`[lints] workspace = true`).
# See ARCHITECTURE.md for the layout and dependency rules.

[workspace]
resolver = "3"
members = [
  "crates/tak-api-types",
  "crates/tak-cot",
  "crates/tak-proto",
  "web/components",
]
# rust/fuzz is a separate cargo-fuzz workspace with its own Cargo.lock,
# deny.toml and native-code allow-list (libFuzzer is C++: a development-only
# exception, Phase 1 plan Q2). Excluding it keeps libfuzzer-sys and cc out of
# this graph, the SBOM, and the workspace-wide make targets.
exclude = ["fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2024"
# MSRV equals the pinned toolchain minor (rust-toolchain.toml); both bump together.
rust-version = "1.99"
license = "Apache-2.0"
publish = false
repository = "https://github.com/192d-Wing/Server"

[workspace.dependencies]
tak-api-types = { path = "crates/tak-api-types" }
tak-cot = { path = "crates/tak-cot" }
tak-proto = { path = "crates/tak-proto" }

# Protocol and CoT (Phase 1). Every entry disables default features so a
# member cannot pull them in by accident; members opt in to what they use.
prost = { version = "0.14", default-features = false }
# Build-time only (tak-proto/build.rs). `format` (prettyplease/syn) is off:
# the generated code is never read by humans or committed.
prost-build = { version = "0.14", default-features = false }
# Pure-Rust protobuf compiler, so no `protoc` binary enters the build. 0.10 is
# the release line that depends on prost/prost-types 0.14 (crates.io index,
# verified 2026-10-27).
protox = { version = "0.10", default-features = false }
quick-xml = { version = "0.42", default-features = false }
ryu = { version = "1", default-features = false }
thiserror = { version = "2", default-features = false }
# Test-only. No `fork`/`timeout` (they spawn processes and pull in more deps).
proptest = { version = "1", default-features = false, features = ["std"] }

# Yew 0.23.x, client-side rendering only (no SSR, no hydration).
yew = { version = "0.23", default-features = false, features = ["csr"] }

[workspace.lints.rust]
# A crate that genuinely needs `unsafe` must define its own `[lints]` table,
# be approved in its plan, and carry `// SAFETY:` on every block.
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# CI runs with `-D warnings`, so warn-level lints also block. A pedantic lint
# may be allowed workspace-wide only with a rationale comment here.
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
exit = "deny"
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
print_stdout = "warn"
print_stderr = "warn"
indexing_slicing = "warn"
string_slice = "warn"

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1
