# SPDX-License-Identifier: Apache-2.0
#
# TAK-RS Cargo workspace root.
#
# COMPLIANCE MAPPING:
# - NIST 800-53: CM-2 (Baseline Configuration), CM-6 (Configuration Settings),
#   CM-10 (Software Usage Restrictions), SA-15 (Development Process, Standards,
#   and Tools)
#
# Every member inherits package metadata (`*.workspace = true`, including
# `license.workspace = true`) and the lint baseline (`[lints] workspace = true`).
# See ARCHITECTURE.md for the layout and dependency rules.

[workspace]
resolver = "3"
members = ["crates/tak-api-types", "web/components"]

[workspace.package]
version = "0.0.1"
edition = "2024"
# MSRV equals the pinned toolchain minor (rust-toolchain.toml); both bump together.
rust-version = "1.99"
license = "Apache-2.0"
publish = false
repository = "https://github.com/192d-Wing/Server"

[workspace.dependencies]
tak-api-types = { path = "crates/tak-api-types" }
# Yew 0.23.x, client-side rendering only (no SSR, no hydration).
yew = { version = "0.23", default-features = false, features = ["csr"] }

[workspace.lints.rust]
# A crate that genuinely needs `unsafe` must define its own `[lints]` table,
# be approved in its plan, and carry `// SAFETY:` on every block.
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# CI runs with `-D warnings`, so warn-level lints also block. A pedantic lint
# may be allowed workspace-wide only with a rationale comment here.
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
exit = "deny"
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
print_stdout = "warn"
print_stderr = "warn"
indexing_slicing = "warn"
string_slice = "warn"

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1
